# LedgeSync static website on the existing Ubuntu origin.
# Install after the ledgesync.com certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name ledgesync.com www.ledgesync.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ledgesync/acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://ledgesync.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ledgesync.com;
    ssl_certificate /etc/letsencrypt/live/ledgesync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledgesync.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://ledgesync.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ledgesync.com;
    ssl_certificate /etc/letsencrypt/live/ledgesync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledgesync.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ledgesync/current;
    index index.html;
    access_log /var/log/nginx/ledgesync.access.log;
    error_log /var/log/nginx/ledgesync.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # APT snapshots and signing secrets live outside website releases.
    # Only the public snapshot is exposed; the signing key is never under it.
    location ^~ /apt/ {
        alias /var/lib/ledgesync-apt/public/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ledgesync/acme;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # Public OAuth branding links use these exact, extensionless URLs.
    location = /privacy-policy {
        try_files /privacy-policy/index.html =404;
        add_header Cache-Control "no-cache, no-transform";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /public-term {
        try_files /public-term/index.html =404;
        add_header Cache-Control "no-cache, no-transform";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
